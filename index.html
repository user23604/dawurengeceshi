<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大五人格测试 (IPIP-NEO-300)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'css/style.css?t=' + new Date().getTime();
        document.head.appendChild(link);
    </script>
</head>
<body>
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="progress-text" id="progress-text" style="margin-bottom: 0;">准备中...</div>
                <span id="sync-status" style="font-size: 12px; font-weight: bold;"></span>
            </div>
            <div style="display: flex; gap: 5px;">
                <button onclick="app.showHistoryModal()" style="padding: 4px 8px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 12px;">📜 历史</button>
                <button onclick="app.exportSaveCode()" style="padding: 4px 8px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 12px;">📤 导出码</button>
                <button onclick="app.importSaveCode()" style="padding: 4px 8px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 12px;">📥 导入</button>
                <button onclick="app.setupGist()" style="padding: 4px 8px; cursor: pointer; border: 1px solid #2196f3; border-radius: 4px; background: #e3f2fd; font-size: 12px; font-weight: bold; color: #1976d2;">☁️ 云同步</button>
            </div>
        </div>
        <div class="progress-container" id="progress-bar"></div>
    </div>

    <div class="container">
        <div id="quiz-screen">
            <div class="card" id="question-card">
                <div style="text-align:center; padding: 50px; font-size: 20px; color: #666;">正在加载核心数据，请稍候...</div>
            </div>
            <div class="controls">
                <button class="nav-btn" id="prev-btn" onclick="app.goPrev()">← 上一题</button>
                <div class="right-controls">
                    <button class="nav-btn skip-btn" id="skip-btn" onclick="app.skipQuestion()">跳过 ⏭</button>
                    <button class="nav-btn" id="next-btn" onclick="app.goNext()">下一题 →</button>
                </div>
            </div>
        </div>

        <div id="result-screen" class="result-screen">
            <h2 class="result-title">测试完成 🎉</h2>
            <div style="text-align: center; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <button class="export-btn" onclick="app.exportExcel()" style="background: #4caf50; font-size: 16px; padding: 15px 30px;">📊 下载专业分析报告 (Excel)</button>
                <button class="export-btn" onclick="app.archiveAndRestart()" style="background: #ff9800; font-size: 14px;">🔄 保存本次进度到历史，并重新测验</button>
            </div>
            <div class="summary-section">
                <table class="result-table" id="domain-table">
                    <thead><tr><th>特质 (Trait)</th><th>计分题数</th><th>总分</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        var script = document.createElement('script');
        script.src = 'js/app.js?t=' + new Date().getTime();
        script.onload = function() { app.init(); };
        document.body.appendChild(script);
    </script>
</body>
</html>
