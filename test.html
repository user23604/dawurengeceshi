<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>大五人格测试 (IPIP-NEO-300)</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Apache ECharts for Data Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script>
        // Register Service Worker for PWA Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('SW registered:', registration.scope))
                    .catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="progress-text" id="progress-text">准备中...</div>
                <span id="sync-status" class="sync-status-text"></span>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="app.showHistoryModal()" title="历史记录">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"></path><circle cx="12" cy="12" r="10"></circle></svg>
                    <span>历史</span>
                </button>
                <button class="icon-btn" onclick="app.exportSaveCode()" title="导出进度码">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
                <button class="icon-btn" onclick="app.importSaveCode()" title="导入进度码">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
                <button class="icon-btn action-btn cloud-btn" onclick="app.setupGist()" title="配置云同步">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
                    <span>云端</span>
                </button>
            </div>
        </div>
        <div class="progress-wrapper">
            <div class="progress-container" id="progress-bar"></div>
        </div>
    </div>

    <div class="container">
        <div id="quiz-screen">
            <div id="question-card" style="flex: 1; display: flex; flex-direction: column;">
                <div style="padding: 60px 0; font-size: 18px; color: var(--text-muted); font-weight: 500;">正在加载数据...</div>
            </div>
            <div class="controls">
                <button class="nav-btn" id="prev-btn" onclick="app.goPrev()">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div class="right-controls">
                    <button class="skip-btn" id="skip-btn" onclick="app.skipQuestion()">跳过</button>
                    <button class="nav-btn primary-btn" id="next-btn" onclick="app.goNext()">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="result-screen" class="result-screen">
            <h2 class="result-title">测试完成</h2>
            <div class="result-actions">
                <button class="export-btn primary-action" onclick="app.exportExcel()">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    下载分析报告
                </button>
                <button class="export-btn secondary-action" onclick="app.archiveAndRestart()">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                    归档并重新测试
                </button>
            </div>
            <div class="summary-section">
                <!-- Echarts Radar container -->
                <div id="radar-chart" style="width: 100%; height: 350px; margin-bottom: 20px;"></div>
                <table class="result-table" id="domain-table">
                    <thead><tr><th>人格特质</th><th>计分题数</th><th>原始分</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div style="text-align:center; padding: 16px; color: #4b5563; font-size: 11px; letter-spacing: 0.05em; opacity: 0.5;">testv_0.12.1</div>

    <script>
        var script = document.createElement('script');
        script.src = 'js/app.js?t=' + new Date().getTime();
        script.onload = function() { app.init(); };
        document.body.appendChild(script);
    </script>
</body>
</html>
